name: Build DualCam APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate project files
        run: |
          echo 'H4sIAAAAAAAC/6WPQYvCMBSE7/kVpaf24g8QPEjXBcXakN17eTRDiKR54TUVZPG/ry4i4sHLzvEbZphJYXY+thTJYUTMxY8qrhIknnxm8Zju6CbH7AKq+gFGOiE215xQeMJOyAbov27Nkh/mRV2URUK0iMPZYOIwZ8/vB7RssZiQK/MKP9fbfd8dem263ab57s1Gd1/1fx/cRiphzlr4iCEvIo0oVkX5MVNoaDQYWCykVD4OYbaoyiWlVNbqF5JmDTZOAQAA' | base64 -d | gunzip > 'settings.gradle.kts'
          echo 'H4sIAAAAAAAC/yvIKU3PzCtWqOZSAILMFA2l5PxcvcS8lKL8zBS9xIKCnMzkxJLM/DwlTYWy1KJiIEtByULPVM9ISQEkW6mQlphTnArXnV+UrpeVWpJUlAg0VS87vyQnMw9mHLIRhnqWekYmqGbUcgEA06N/TY4AAAA=' | base64 -d | gunzip > 'build.gradle.kts'
          echo 'H4sIAAAAAAAC/z3LsQqDQAwA0N1/aZDSocsN0j8oHVyDF4/YXALJKfr3DoLbW555geKYhWDZKnqJ9Bjr/uxf79qhZjfOsAYNF8fUfKXub01YYbJMEO0QSjbPPDHKfdT056jBjTf6fgQjrnsCdhRkaHIAAAA=' | base64 -d | gunzip > 'gradle.properties'
          mkdir -p 'app'
          echo '' | base64 -d | gunzip > 'app/build.gradle.kts'
          mkdir -p 'app/src/main'
          echo '' | base64 -d | gunzip > 'app/src/main/AndroidManifest.xml'
          mkdir -p 'app/src/main/java/com/filmset/dualcam'
          echo '' | base64 -d | gunzip > 'app/src/main/java/com/filmset/dualcam/MainActivity.kt'
          mkdir -p 'app/src/main/res/values'
          echo 'H4sIAAAAAAAC/7Oxr8jNUShLLSrOzM+zVTLUM1BSSM1Lzk/JzEu3VSotSdO1ULK347IpSi3OLy1KTi2241IAApvikiKgCoW8xNxUW6XEgoJ4EEvJzqU0Mcc5MddGHyIP1KiPpBMAmzTMRm0AAAA=' | base64 -d | gunzip > 'app/src/main/res/values/strings.xml'
          mkdir -p 'app/src/main/res/values'
          echo 'H4sIAAAAAAAC/42Qy27CMBBF93yFNXsSukOVEwhULLPiB1x7AAt7JhrbpPw9KQ+pUjfM8l6dM9LVq58Y1AUleaYGPqoFKCTLztOxgZIP8yWs2pkWTFzEYmpnajqd8jWgIhOxgf0JI1ZfxYStiaAGI0j5FXfDsOU4mFz13Nk8fdkYgYflbvIZ41NkyAl79zl6cjxujD0fhQs5aNevynJgqb/D1On6F33HtCshJCuIBG2Wgu+TPe99Dvgf0/V9gWmZ+s80N9Vvp8ZOAQAA' | base64 -d | gunzip > 'app/src/main/res/values/themes.xml'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DualCam.apk

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualCam-APK
          path: DualCam.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DualCam APK
          files: DualCam.apk
